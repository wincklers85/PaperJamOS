[platformio]
default_envs = m5paper

[env:m5paper]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = default.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = dio

build_flags =
  -D PAPERJAM_VERSION=\"0.0.1-alpha\"
  -D CORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

lib_deps =
  https://github.com/m5stack/M5EPD.git
  https://github.com/Seeed-Studio/PN532.git
  https://github.com/OSSLibraries/Arduino_MFRC522v2.git

lib_ldf_mode = deep+
