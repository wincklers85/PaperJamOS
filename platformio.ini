[platformio]
default_envs = m5paper

[env:m5paper]
platform = espressif32@6.12.0
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -D PAPERJAM_VERSION=\"0.0.1-alpha\"
  -D CORE_DEBUG_LEVEL=1

lib_deps =
  https://github.com/m5stack/M5EPD.git
  https://github.com/Seeed-Studio/PN532.git

lib_ldf_mode = deep+
